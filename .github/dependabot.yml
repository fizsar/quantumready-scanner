version: 2

# Weekly, grouped to keep PR noise low. Dependabot keeps SHA-pinned actions
# pinned (it updates the SHA and the version comment).
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/, /web]
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
