name: Release

# Publishes the images to GHCR after CI passes on a push to main, with the
# Trivy gate, an immutable sha-<commit> tag and :latest. (Until 16/11/2026
# also for the showcase branch, which never moved :latest.) workflow_run runs this file as it is on the
# default branch, so changes here take effect once they are on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# One release at a time per branch; a newer commit's release cancels the one
# in progress (only the tip is deployed; its images are published in full).
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish (${{ matrix.image }})
    # Only CI runs of a push to this repository by its owner: never a pull
    # request (from a fork or not; its CI run has event pull_request), never a
    # run whose code comes from another repository, never another actor.
    # internal/cipolicy evaluates this condition against such events.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The pushed digest, recorded as a status of the commit (deploy.sh pins it).
      statuses: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile
          - image: web
            context: web
            file: web/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/quantumready-saas-${{ matrix.image }}
      # Official image pinned by digest, run directly instead of a third-party action
      # in a job that holds packages:write. Bump the tag and digest together.
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: meta
        run: |
          {
            echo "version=$(git describe --tags --always)"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "tag=sha-$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.image }}

      # The scanned image is the one that gets pushed.
      - name: Trivy (report HIGH and CRITICAL)
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE" --cache-dir /cache "$@"
          }
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format table "$REF" | tee trivy.txt
          {
            echo "### Trivy: \`$REF\`"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate: any HIGH or CRITICAL with a fix available blocks the release.
      # Exceptions only in .trivyignore.yaml (justified, with expired_at: after
      # that day the finding blocks again); the report above lists everything.
      - name: Trivy (fail on fixable HIGH and CRITICAL)
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          python3 .github/scripts/trivyignore_check.py .trivyignore.yaml
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy:/cache" -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" "$TRIVY_IMAGE" --cache-dir /cache \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /trivyignore.yaml \
            --exit-code 1 --skip-db-update --quiet "$REF"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          docker push "$IMAGE:$TAG"
          if [ "$BRANCH" = main ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
            echo "Pushed \`$IMAGE:$TAG\` and \`:latest\` (main)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pushed \`$IMAGE:$TAG\` ($BRANCH; \`:latest\` unchanged)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The digest of what was just scanned and pushed, as a status of the
      # commit (release/api, release/web): deploy.sh deploys exactly this
      # image (image@sha256), never whatever the tag points to later.
      - name: Record the digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ matrix.image }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          digest=$(docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$TAG" \
            | sed -n "s|^$IMAGE@\(sha256:[0-9a-f]\{64\}\)\$|\1|p" | head -1)
          [ -n "$digest" ] || { echo "no repo digest for $IMAGE:$TAG after the push" >&2; exit 1; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context="release/$NAME" -f description="$digest" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          echo "Recorded \`$IMAGE@$digest\` as status release/$NAME of $SHA" >> "$GITHUB_STEP_SUMMARY"
