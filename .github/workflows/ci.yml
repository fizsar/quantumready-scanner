name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qr
          POSTGRES_PASSWORD: qr
          POSTGRES_DB: qr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qr -d qr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      QR_TEST_DATABASE_URL: postgres://qr:qr@localhost:5432/qr?sslmode=disable
      # Integration tests fail instead of skipping if the database URL is missing.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Test (with PostgreSQL integration tests)
        run: go test -race -count=1 -json ./... | tee go-test.json | jq -rj 'select(.Action == "output") | .Output'
      - name: Integration tests ran
        run: |
          jq -r 'select((.Action == "pass" or .Action == "skip" or .Action == "fail") and (.Test // "" | test("Postgres$"))) | "\(.Action) \(.Package | sub(".*/quantumready-saas/"; "")) \(.Test)"' go-test.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile
          - image: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
