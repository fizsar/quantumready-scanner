name: Scorecard

# OpenSSF Scorecard: supply-chain checks of the repository (pinned actions,
# token permissions, branch protection, dangerous workflows…), published to
# the OpenSSF API and to code scanning. Public repositories only: runs once
# the repository variable QR_REPO_PUBLIC is "true".
on:
  branch_protection_rule:
  schedule:
    - cron: "31 5 * * 1"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    if: vars.QR_REPO_PUBLIC == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results (signed with the workflow's identity)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
