# Production stack for quantumready.fizsar.com (on the VPS: /opt/quantumready).
#
# The host's Caddy runs in a container on the shared external network `web` and
# proxies by name: /api/* -> quantumready-api:8080, everything else ->
# quantumready-web:8080. The 127.0.0.1:8080/8081 ports are only for local
# checks (deploy script, curl on the host).
#
# Images come from GHCR; QR_TAG (in .env) selects the release, e.g. sha-14226c7.
# Secrets come from .env (see .env.example). Locally, `make prod-up` adds
# compose.build.yaml to build the images instead of pulling them.
#
# Limits are sized for a small VPS that also serves fizsar.com.
name: quantumready

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-api-image: &api-image ghcr.io/fizsar/quantumready-saas-api:${QR_TAG:?set QR_TAG in .env}

x-database-url: &database-url "postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}?sslmode=disable"

services:
  db:
    # PostgreSQL 17.11 (tag 17-alpine), pinned by digest: updates, minor ones
    # too, come as Dependabot PRs and are deployed on purpose (CLAUDE.md).
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    <<: *hardening
    # uid 70 in the alpine image: no root entrypoint, so no capabilities needed.
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    shm_size: 128m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 200 }
    # Equal to the memory limit: containers never use host swap.
    memswap_limit: 512M

  # One-shot: applies migrations and exits. The API starts only if it succeeds.
  migrate:
    image: *api-image
    <<: *hardening
    entrypoint: ["/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M, pids: 50 }
    # Equal to the memory limit: containers never use host swap.
    memswap_limit: 128M

  api:
    image: *api-image
    <<: *hardening
    restart: unless-stopped
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: *database-url
      # Exact hosts that may be scanned in this phase.
      SCAN_ALLOWLIST: ${SCAN_ALLOWLIST:-fizsar.com,quantumready.fizsar.com}
      # Our own domains (exact hosts): their public scans are full, raw probes
      # included; any other domain's, basic.
      SCAN_FULL_DOMAINS: ${SCAN_FULL_DOMAINS:-fizsar.com,quantumready.fizsar.com}
      # X-Forwarded-For is only believed from the Caddy network (subnet of the
      # `web` network; deploy.sh and make prod-up fill it in).
      TRUSTED_PROXIES: ${QR_TRUSTED_PROXIES:-}
      # Scan request limits (defaults: 5/min and 30/day per client, 2 min per target).
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-5}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-30}
      SCAN_TARGET_COOLDOWN: ${SCAN_TARGET_COOLDOWN:-2m}
      # The site's origin (https://quantumready.fizsar.com): every POST from
      # another site is refused (403 bad_origin). Set it in production.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # Accounts, organizations and verified domains (/api/auth, /api/org…):
      # off in production (decision of 31/10/2026); true needs PUBLIC_ORIGIN.
      ACCOUNTS_ENABLED: ${ACCOUNTS_ENABLED:-false}
      MAIL_SUPPORT: ${MAIL_SUPPORT:-soporte@fizsar.com}
      # Public scanning of any domain: off until the security review (needs ALTCHA_HMAC_KEY).
      PUBLIC_SCAN_OPEN: ${PUBLIC_SCAN_OPEN:-false}
      # Queued public scans above which new ones get 429 busy; and the
      # worker's pace, for the wait shown to visitors (same value as the worker).
      QR_PUBLIC_QUEUE_MAX: ${QR_PUBLIC_QUEUE_MAX:-100}
      WORKER_MAX_SCANS_PER_MINUTE: ${WORKER_MAX_SCANS_PER_MINUTE:-20}
      # Proof of work for open public scans and the demo form (one key).
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      # Closed beta: invited accounts cannot create organizations ("true" lifts it).
      BETA_INVITED_CAN_CREATE_ORGS: ${BETA_INVITED_CAN_CREATE_ORGS:-false}
      # "Request a free demo": off (portfolio); the email to support, off.
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_NOTIFY: ${DEMO_NOTIFY:-false}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      backend: {}
      web:
        aliases: [quantumready-api]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M, pids: 100 }
    # Equal to the memory limit: containers never use host swap.
    memswap_limit: 256M

  # Scans the queue. Reaches PostgreSQL (backend) and the Internet (egress),
  # never the Caddy network (web): a scan target cannot reach Caddy or the API
  # through it, and the scanner's anti-SSRF guard blocks private ranges anyway.
  worker:
    image: *api-image
    <<: *hardening
    entrypoint: ["/worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      # Scans started per minute by all workers together (good Internet citizen).
      WORKER_MAX_SCANS_PER_MINUTE: ${WORKER_MAX_SCANS_PER_MINUTE:-20}
      # Public scans queued longer than this fail with queue_timeout.
      QR_PUBLIC_QUEUE_TIMEOUT: ${QR_PUBLIC_QUEUE_TIMEOUT:-15m}
    tmpfs:
      - /tmp # heartbeat file for the healthcheck
    networks: [backend, egress]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/worker", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # In-flight scans get up to 50 s to finish on stop (worker ShutdownTimeout).
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M, pids: 100 }
    # Equal to the memory limit: containers never use host swap.
    memswap_limit: 256M

  # Sends the queued emails (Scaleway TEM). Its database role reads only the
  # email outbox (docs/security.md). Own way out (mail-egress), not the
  # worker's, and never the Caddy network. Only with COMPOSE_PROFILES=mail in
  # .env (from milestone 3.7, with the SMTP credentials).
  mailer:
    image: *api-image
    <<: *hardening
    profiles: [mail]
    entrypoint: ["/mailer"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      SMTP_HOST: ${SMTP_HOST:-smtp.tem.scaleway.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-QuantumReady <no-reply@quantumready.fizsar.com>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-soporte@fizsar.com}
    tmpfs:
      - /tmp # heartbeat file for the healthcheck
    networks: [backend, mail-egress]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/mailer", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M, pids: 50 }
    # Equal to the memory limit: containers never use host swap.
    memswap_limit: 64M

  web:
    image: ghcr.io/fizsar/quantumready-saas-web:${QR_TAG:?set QR_TAG in .env}
    <<: *hardening
    restart: unless-stopped
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      web:
        aliases: [quantumready-web]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M, pids: 50 }
    # Equal to the memory limit: containers never use host swap.
    memswap_limit: 64M

networks:
  # No route outside: only api, migrate, worker and mailer can reach the database.
  backend:
    internal: true
  # The worker's own way out to the Internet (scan targets); nothing else on it.
  egress: {}
  # The mailer's way out (SMTP provider).
  mail-egress: {}
  # Shared with the host's Caddy container (created by /srv/caddy/compose.yaml).
  web:
    external: true
    name: web

volumes:
  db-data:
