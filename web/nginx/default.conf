# Static server for the React app. TLS, HSTS and compression are handled by
# the host's Caddy, which proxies everything except /api/* here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed files under /assets/: cache them for a year.
    # A missing asset is a 404, never index.html.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Scan results are private-ish shareable links: keep them out of search engines.
    location /scans/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Served here (not a fallback URI, which would redirect to `location /`
        # and lose the headers above).
        try_files /index.html =404;
    }

    # Account pages that only make sense to their user (email links, settings).
    location ~ ^/(verify|reset|account|org|invite)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # Prototypes of the redesign (/lab/...): reachable but hidden from search engines.
    # Their still images (/lab/story-*.png) are real files.
    location /lab/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html =404;
    }

    # Everything else: real file or index.html (client-side routing). Always revalidate.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
