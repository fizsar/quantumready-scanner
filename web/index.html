<!doctype html>
<!-- lang and the metadata below are in English (link previews, search results);
     the app switches lang to the visitor's language as soon as it loads. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060b" />
    <!-- Preload one file: Bricolage Grotesque 400 latin (tokens.css), which paints the LCP (the
         lead paragraph). Every other face loads when used, behind a metric-matched fallback. Same
         file as its @font-face, so Vite emits one hashed asset. crossorigin: fonts are fetched in
         CORS mode, and a preload without it is wasted. -->
    <link rel="preload" href="/src/assets/fonts/bricolage-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>QuantumReady · Post-quantum TLS scanner (ML-KEM, X25519MLKEM768)</title>
    <meta
      name="description"
      content="QuantumReady, a free post-quantum TLS scanner: check whether your website offers ML-KEM key exchange (X25519MLKEM768), which TLS versions and ciphers it accepts and its TLS certificate, in plain language."
    />
    <!-- The SPA moves it to the current page (usePageMeta); this is the home page. -->
    <link rel="canonical" href="https://quantumready.fizsar.com/" />
    <!-- Both languages of each page (?lang=es / ?lang=en) and x-default (the app picks the
         visitor's language); usePageMeta moves them to the current page. -->
    <link rel="alternate" hreflang="es" href="https://quantumready.fizsar.com/?lang=es" />
    <link rel="alternate" hreflang="en" href="https://quantumready.fizsar.com/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://quantumready.fizsar.com/" />

    <!-- One preview for every route (SPA, no prerender yet). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuantumReady" />
    <meta property="og:url" content="https://quantumready.fizsar.com/" />
    <meta property="og:title" content="QuantumReady · Post-quantum TLS scanner (ML-KEM, X25519MLKEM768)" />
    <meta
      property="og:description"
      content="A free post-quantum TLS scanner: ML-KEM key exchange (X25519MLKEM768), TLS versions, ciphers and the TLS certificate, explained in plain language."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:image" content="https://quantumready.fizsar.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="QuantumReady: post-quantum TLS scanner (ML-KEM, X25519MLKEM768)."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuantumReady · Post-quantum TLS scanner (ML-KEM, X25519MLKEM768)" />
    <meta
      name="twitter:description"
      content="A free post-quantum TLS scanner: ML-KEM (X25519MLKEM768), TLS versions, ciphers and the TLS certificate, in plain language."
    />
    <meta name="twitter:image" content="https://quantumready.fizsar.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="QuantumReady: post-quantum TLS scanner (ML-KEM, X25519MLKEM768)."
    />

    <!-- Structured data: a data block, never executed, so script-src 'self' does not apply. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "QuantumReady",
        "url": "https://quantumready.fizsar.com/",
        "description": "Free post-quantum TLS scanner: whether a website offers ML-KEM key exchange (X25519MLKEM768), which TLS versions and ciphers it accepts and its TLS certificate, explained in plain language.",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["en", "es"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "image": "https://quantumready.fizsar.com/og.png",
        "author": { "@type": "Person", "name": "Fiz Sar López", "url": "https://fizsar.com/" },
        "creator": { "@type": "Person", "name": "Fiz Sar López", "url": "https://fizsar.com/" },
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "sameAs": ["https://github.com/fizsar/quantumready-scanner"],
        "isBasedOn": { "@type": "SoftwareSourceCode", "codeRepository": "https://github.com/fizsar/quantumready-scanner", "programmingLanguage": ["Go", "TypeScript"] }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
