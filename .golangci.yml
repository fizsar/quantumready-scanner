version: "2"

linters:
  # Defaults (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*net/http.Response).Body.Close
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may use simpler HTTP helpers.
      - path: _test\.go
        linters: [noctx, gosec]
      # Bilingual user-facing texts: the English spell checker flags Spanish words.
      - path: internal/catalog/catalog\.go
        linters: [misspell]
      # Spanish comparison table written for docs/validation.md.
      - path: internal/scanner/tlslab_test\.go
        linters: [misspell]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fizsar/quantumready-saas
